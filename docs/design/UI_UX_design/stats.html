<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thống kê sử dụng — Chat với tài liệu</title>
  <meta name="description" content="Thống kê theo tuần cho quản lý: người dùng hoạt động, số câu hỏi, tỷ lệ không tìm thấy, tỷ lệ hữu ích. Trace: US-019, US-020, UC-24, MET-003, MET-004.">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
</head>
<body>
  <main class="page" id="main" tabindex="-1"></main>
  <script src="assets/common.js"></script>
  <script src="assets/mock-data.js"></script>
  <script>
  (function () {
    const { icon, track } = window.CWD;
    const s = window.CWD.renderHeader("stats");
    const main = document.getElementById("main");
    if (!s.canStats) {
      main.innerHTML = '<div class="card"><div class="empty"><div class="empty-icon">' + icon("lock", "icon-lg") + '</div><h1>Bạn không có quyền xem trang này</h1><p>Thống kê sử dụng chỉ dành cho vai trò Quản lý.</p><a class="btn btn-secondary" href="workspace.html">Về trang Hỏi đáp</a></div></div>';
      window.CWD.demoPanel("Thống kê");
      return;
    }
    track("stats_viewed", {});
    const ALL = window.CWD_DATA.weekly;
    let range = 8, data = ALL.slice(-range), empty = false;
    const pct = v => Math.round(v * 100) + "%";
    const num = v => v.toLocaleString("vi-VN");

    main.innerHTML =
      '<div class="page-header"><div><h1>Thống kê sử dụng</h1><p class="muted">Số liệu theo tuần (thứ Hai – Chủ nhật). Không chứa nội dung câu hỏi của người dùng.</p></div></div>' +
      '<div class="filter-row"><span class="muted">Khoảng thời gian</span><div class="segmented" role="group" aria-label="Khoảng thời gian">' +
      '<button type="button" data-range="4" aria-pressed="false">4 tuần</button><button type="button" data-range="8" aria-pressed="true">8 tuần</button></div><span class="muted" id="range-label"></span></div>' +
      '<div id="content"></div>';

    function delta(cur, prev, kind, upIsGood) {
      if (prev == null) return "";
      const d = kind === "rate" ? Math.round((cur - prev) * 100) : cur - prev;
      if (d === 0) return '<span class="tile-delta">Không đổi so với tuần trước</span>';
      const good = (d > 0) === upIsGood;
      const txt = (d > 0 ? "+" : "−") + Math.abs(d) + (kind === "rate" ? " điểm %" : "") + " so với tuần trước";
      return '<span class="tile-delta ' + (good ? "up" : "down") + '">' + icon(d > 0 ? "arrowUp" : "arrowDown", "icon-sm") + txt + "</span>";
    }

    function render() {
      const content = document.getElementById("content");
      document.getElementById("range-label").textContent = empty ? "" : "Tuần " + data[0].label.slice(1) + " – " + data[data.length - 1].label.slice(1) + " năm 2026";
      if (empty) {
        content.innerHTML = '<div class="card"><div class="empty"><div class="empty-icon">' + icon("chart", "icon-lg") + '</div><h2>Chưa có dữ liệu sử dụng</h2><p>Số liệu sẽ xuất hiện sau tuần đầu tiên của pilot.</p></div></div>';
        return;
      }
      const cur = data[data.length - 1], prev = data[data.length - 2];
      content.innerHTML =
        '<section class="tiles" aria-label="Tuần gần nhất">' +
        '<div class="card tile"><div class="tile-label">Người dùng hoạt động</div><div class="tile-value">' + cur.active + " / " + cur.authorized + '</div>' + delta(cur.active, prev && prev.active, "count", true) + "</div>" +
        '<div class="card tile"><div class="tile-label">Số câu hỏi</div><div class="tile-value">' + num(cur.questions) + "</div>" + delta(cur.questions, prev && prev.questions, "count", true) + "</div>" +
        '<div class="card tile"><div class="tile-label">Tỷ lệ “không tìm thấy”</div><div class="tile-value">' + pct(cur.notFoundRate) + "</div>" + delta(cur.notFoundRate, prev && prev.notFoundRate, "rate", false) + "</div>" +
        '<div class="card tile"><div class="tile-label">Tỷ lệ câu trả lời hữu ích</div><div class="tile-value">' + pct(cur.helpfulRate) + "</div>" + delta(cur.helpfulRate, prev && prev.helpfulRate, "rate", true) + "</div>" +
        "</section>" +
        '<section class="charts">' +
        '<div class="card chart-card" id="c1"><h2>Người dùng hoạt động mỗi tuần</h2><p>Số người đặt ít nhất 1 câu hỏi trong tuần · tổng ' + cur.authorized + " người được cấp quyền</p></div>" +
        '<div class="card chart-card" id="c2"><h2>Số câu hỏi mỗi tuần</h2><p>Tổng số câu hỏi của mọi người dùng</p></div>' +
        "</section>" +
        '<section class="card table-wrap" aria-labelledby="tbl-title"><div class="card-pad" style="padding-bottom:0"><h2 id="tbl-title">Bảng số liệu</h2></div>' +
        '<table class="data"><thead><tr><th scope="col">Tuần</th><th scope="col" class="num">Người dùng hoạt động</th><th scope="col" class="num">Tỷ lệ hoạt động</th><th scope="col" class="num">Số câu hỏi</th><th scope="col" class="num">Không tìm thấy</th><th scope="col" class="num">Hữu ích</th></tr></thead><tbody>' +
        data.map(w => "<tr><td>" + w.week + '</td><td class="num">' + w.active + '</td><td class="num">' + pct(w.active / w.authorized) + '</td><td class="num">' + num(w.questions) + '</td><td class="num">' + pct(w.notFoundRate) + '</td><td class="num">' + pct(w.helpfulRate) + "</td></tr>").join("") +
        "</tbody></table></section>";
      columnChart(document.getElementById("c1"), data, "active", v => v + " người", 20);
      columnChart(document.getElementById("c2"), data, "questions", v => num(v) + " câu hỏi");
    }

    function niceMax(v) { const steps = [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000]; for (const st of steps) { if (v <= st * 4) return Math.ceil(v / st) * st; } return Math.ceil(v / 1000) * 1000; }
    function columnChart(card, rows, key, fmtVal, fixedMax) {
      const NS = "http://www.w3.org/2000/svg";
      const width = Math.max(280, card.clientWidth - 40), height = 220;
      const m = { top: 20, right: 8, bottom: 26, left: 40 };
      const iw = width - m.left - m.right, ih = height - m.top - m.bottom;
      const max = fixedMax || niceMax(Math.max(...rows.map(r => r[key])));
      const ticks = [0, max / 4, max / 2, (3 * max) / 4, max];
      const svg = document.createElementNS(NS, "svg");
      svg.setAttribute("class", "chart"); svg.setAttribute("viewBox", "0 0 " + width + " " + height); svg.setAttribute("role", "img");
      svg.setAttribute("aria-label", card.querySelector("h2").textContent + ". Xem số liệu chi tiết trong bảng bên dưới.");
      const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); (parent || svg).appendChild(n); return n; };
      const y = v => m.top + ih - (v / max) * ih;
      const grid = el("g", { class: "grid" }), axis = el("g", { class: "axis" });
      ticks.forEach(t => {
        el("line", { x1: m.left, x2: width - m.right, y1: y(t), y2: y(t) }, grid);
        const tx = el("text", { x: m.left - 8, y: y(t) + 4, "text-anchor": "end" }, axis);
        tx.textContent = t >= 1000 ? (t / 1000).toLocaleString("vi-VN") + "K" : String(Math.round(t));
      });
      const band = iw / rows.length, bw = Math.min(24, band * 0.6);
      const tip = document.createElement("div"); tip.className = "chart-tooltip"; tip.hidden = true; card.appendChild(tip);
      rows.forEach((r, i) => {
        const cx = m.left + band * i + band / 2, x = cx - bw / 2, top = y(r[key]), h = m.top + ih - top, rr = Math.min(4, h);
        const g = el("g", { class: "col" });
        el("path", { class: "bar", d: "M" + x + "," + (top + h) + " V" + (top + rr) + " Q" + x + "," + top + " " + (x + rr) + "," + top + " H" + (x + bw - rr) + " Q" + (x + bw) + "," + top + " " + (x + bw) + "," + (top + rr) + " V" + (top + h) + " Z" }, g);
        const hit = el("rect", { class: "bar-hit", x: m.left + band * i, y: m.top, width: band, height: ih, tabindex: "0", role: "img" }, g);
        hit.setAttribute("aria-label", r.week + ": " + fmtVal(r[key]));
        const lbl = el("text", { x: cx, y: height - 8, "text-anchor": "middle" }, axis); lbl.textContent = r.label;
        if (i === rows.length - 1) { const v = el("text", { class: "value-label", x: cx, y: top - 6, "text-anchor": "middle" }); v.textContent = key === "questions" ? num(r[key]) : String(r[key]); }
        const show = () => {
          g.classList.add("is-active");
          tip.replaceChildren();
          const val = document.createElement("div"); val.className = "tt-value"; val.textContent = fmtVal(r[key]);
          const row = document.createElement("div"); row.className = "tt-row"; const k = document.createElement("span"); k.className = "tt-key"; const t = document.createElement("span"); t.textContent = "Tuần " + r.week.split("-W")[1] + " · " + r.week.slice(0, 4);
          row.append(k, t); tip.append(val, row); tip.hidden = false;
          const scale = svg.getBoundingClientRect().width / width;
          tip.style.left = Math.min(card.clientWidth - 160, Math.max(8, 20 + cx * scale - 70)) + "px";
          tip.style.top = (svg.offsetTop + top * scale - 64) + "px";
        };
        const hide = () => { g.classList.remove("is-active"); tip.hidden = true; };
        hit.addEventListener("pointerenter", show); hit.addEventListener("pointerleave", hide);
        hit.addEventListener("focus", show); hit.addEventListener("blur", hide);
      });
      card.appendChild(svg);
    }

    main.querySelectorAll("[data-range]").forEach(b => b.addEventListener("click", () => {
      main.querySelectorAll("[data-range]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      range = +b.dataset.range;
      const c = document.getElementById("content"); c.style.opacity = ".55"; c.style.transition = "opacity 120ms";
      setTimeout(() => { data = ALL.slice(-range); render(); c.style.opacity = "1"; }, 350);
    }));
    let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });
    render();
    window.CWD.demoPanel("Thống kê", panel => {
      const b = document.createElement("button"); b.className = "btn btn-secondary btn-sm"; b.textContent = "Chưa có dữ liệu / có dữ liệu";
      b.addEventListener("click", () => { empty = !empty; render(); }); panel.appendChild(b);
    });
  })();
  </script>
</body>
</html>
